<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="학습용으로 제작 중인 개인 포트폴리오입니다.">
    <title>포트폴리오 준비 중</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="#home" aria-label="포트폴리오 홈">Portfolio</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="#skills">기술</a>
        <a href="#projects">프로젝트</a>
        <a href="#contact">연락</a>
      </nav>
    </header>

    <main id="main-content">
      <section id="home" aria-labelledby="home-title">
        <p>Temporary portfolio</p>
        <h1 id="home-title">내용을 준비하고 있습니다.</h1>
      </section>

      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">소개</h2>
        <p>사용자 정보가 확정되면 소개 문구가 교체됩니다.</p>
      </section>

      <section id="skills" aria-labelledby="skills-title">
        <h2 id="skills-title">기술</h2>
        <p>학습 내용과 기술 목록을 준비하고 있습니다.</p>
      </section>

      <section id="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">프로젝트</h2>
        <article>
          <h3>프로젝트 준비 중</h3>
          <p>실제 프로젝트 정보가 제공되면 이 영역에 표시됩니다.</p>
        </article>
      </section>

      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">연락</h2>
        <p>로컬 데모 문의 양식을 준비하고 있습니다.</p>
      </section>
    </main>

    <footer>
      <p>임시 포트폴리오 · 로컬 데모</p>
    </footer>
  </body>
</html>
